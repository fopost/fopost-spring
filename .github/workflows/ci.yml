name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # com.fopost:fopost-java is not on Maven Central yet, so the parent is built
      # from source into the local repository first. Delete this step once it is
      # published — the dependency in pom.xml already names the released coordinate.
      - name: Install the parent SDK from source
        run: |
          git clone --depth 1 https://github.com/fopost/fopost-java.git "${RUNNER_TEMP}/fopost-java"
          mvn -B -q install -DskipTests -f "${RUNNER_TEMP}/fopost-java/pom.xml"

      - run: mvn -B verify
