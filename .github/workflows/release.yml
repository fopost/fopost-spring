name: Release

# Tag the commit as v<version> matching pom.xml, e.g. v0.1.0.
# Publishing needs four secrets on the `central` environment:
# MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates publishing behind a dedicated environment, so commit access alone
    # does not grant the ability to push a release to Maven Central.
    environment:
      name: central
      url: https://central.sonatype.com/artifact/com.fopost/fopost-spring-boot-starter
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # Drop this step once com.fopost:fopost-java is on Maven Central.
      - name: Install the parent SDK from source
        run: |
          git clone --depth 1 https://github.com/fopost/fopost-java.git "${RUNNER_TEMP}/fopost-java"
          mvn -B -q install -DskipTests -f "${RUNNER_TEMP}/fopost-java/pom.xml"

      - name: Verify the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          [ "$VERSION" = "$TAG" ] || { echo "::error::pom.xml is $VERSION but the tag is $TAG"; exit 1; }

      - run: mvn -B verify

      # Central rejects a release whose parent dependency it cannot resolve, so this
      # must not run until fopost-java is published.
      - name: Publish to Maven Central
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -Prelease deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
